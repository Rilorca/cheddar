name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  flatpak-bundle:
    name: "Build Flatpak Bundle"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          # The flatpak-builder action installs deps with --system as the
          # unprivileged runner user; allow it via polkit.
          echo "polkit.addRule(function(action, subject) { if (action.id.indexOf('org.freedesktop.Flatpak') == 0 && subject.user == 'runner') { return polkit.Result.YES; } });" | sudo tee /etc/polkit-1/rules.d/10-flatpak-allow-runner.rules > /dev/null
          sudo systemctl restart polkit.service || true

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: io.github.rilorca.Cheddar.flatpak
          manifest-path: io.github.rilorca.Cheddar.json
          app-id: io.github.rilorca.Cheddar

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheddar-Flatpak
          path: io.github.rilorca.Cheddar.flatpak

  daemon-binary:
    name: "Build Rust Daemon"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Rust Daemon
        run: |
          cargo build --manifest-path daemon-rs/Cargo.toml --release
          mkdir -p dist/cheddar-autopilot
          cp daemon-rs/target/release/cheddar-autopilot dist/cheddar-autopilot/
          cp data/cheddar-autopilot.service.in dist/cheddar-autopilot/cheddar-autopilot.service
          sed -i 's|@bindir@|/usr/local/bin|g' dist/cheddar-autopilot/cheddar-autopilot.service
          tar -czvf cheddar-autopilot-linux-x86_64.tar.gz -C dist/cheddar-autopilot .

      - name: Upload Daemon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheddar-Daemon-Binary
          path: cheddar-autopilot-linux-x86_64.tar.gz

  release:
    name: "Publish Release Assets"
    needs: [flatpak-bundle, daemon-binary]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Flatpak
        uses: actions/download-artifact@v4
        with:
          name: Cheddar-Flatpak

      - name: Download Daemon
        uses: actions/download-artifact@v4
        with:
          name: Cheddar-Daemon-Binary

      - name: Publish Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            io.github.rilorca.Cheddar.flatpak
            cheddar-autopilot-linux-x86_64.tar.gz
          generate_release_notes: true
